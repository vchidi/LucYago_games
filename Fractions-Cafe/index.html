<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sweet Fractions Café</title>
<style>
:root{
  --pink:#ff8fc7;--pinkDark:#ff4da6;--cream:#fff7df;--brown:#6b3f21;--good:#16a34a;--bad:#dc2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#ffe7f3,#ffe7bd);color:#352313}
button{font-family:inherit;border:0;border-radius:14px;background:white;font-weight:900;box-shadow:0 4px 0 rgba(100,50,20,.18);cursor:pointer}
button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(100,50,20,.18)}
input{font-family:inherit}
.app{height:100dvh;display:flex;flex-direction:column;padding:8px;gap:8px;overflow:hidden}
.top{height:50px;min-height:50px;background:rgba(255,255,255,.9);border-radius:18px;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 20px rgba(120,60,20,.15)}
.title{font-size:21px;font-weight:950;display:flex;align-items:center;gap:10px;white-space:nowrap}
.titleTablet{display:inline-flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.stats{font-weight:950;display:flex;gap:10px;flex-wrap:wrap;font-size:14px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:210px 1fr;gap:8px}
.menu{background:rgba(255,255,255,.72);border-radius:18px;padding:8px;overflow:auto;box-shadow:0 8px 20px rgba(120,60,20,.12)}
.menu button{width:100%;margin-bottom:8px;padding:11px 10px;font-size:16px;text-align:left}
.homeBtn{
display:flex;
align-items:center;
justify-content:flex-start;
font-size:26px;
text-align:left;
background:transparent;
color:#ff8fc7;
box-shadow:none;
padding-left:4px;
}
.homeBtn:active{
transform:none;
box-shadow:none;
}
.menu button.active{background:linear-gradient(135deg,#ff73b7,#ffc266);color:white}
.panel{height:100%;min-height:0;background:rgba(255,253,248,.9);border-radius:18px;padding:10px;display:grid;grid-template-rows:minmax(0,1fr) 225px;gap:8px;overflow:hidden;box-shadow:0 8px 20px rgba(120,60,20,.12)}
.exerciseBox{min-height:0;overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
.modeTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px}
.promptTitle{background:white;border-radius:16px;padding:9px 12px;font-size:20px;font-weight:950;border:3px solid rgba(0,0,0,.05)}
.actionRow{display:flex;gap:8px;flex-wrap:wrap}
.actionRow button{padding:10px 12px;font-size:16px}
.fractionNote{font-size:14px;line-height:1.25;font-weight:850;color:#6b3f21;background:#fffaf0;border:2px solid rgba(255,143,199,.18);border-radius:12px;padding:6px 10px;text-align:center}
.fractionNote div{margin:1px 0}
.workGrid{min-height:0;display:grid;grid-template-columns:minmax(360px,.82fr) minmax(300px,1.18fr);gap:10px}
.workGrid.readMode{grid-template-columns:1fr!important}
.workGrid.readMode .helpPane{display:none!important}
.leftExercise{background:white;border-radius:18px;border:3px solid rgba(255,143,199,.22);padding:12px;display:flex;align-items:center;justify-content:center;min-height:0;overflow:auto}
.helpPane{background:#f2fff3;border-radius:18px;border:3px dashed #3fbf6f;padding:10px;min-height:0;overflow:hidden;display:flex;align-items:stretch;justify-content:stretch}
.helpEmpty{font-weight:900;color:#9a6b4a;text-align:center;font-size:18px}
.drawPad{width:100%;height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
.drawTools{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.drawTools button{font-size:13px;padding:6px 9px;border-radius:12px;background:#eaffef;color:#14532d;box-shadow:0 3px 0 rgba(20,83,45,.16)}
.drawTools button.active{background:#bbf7d0}
.inkColors{display:flex;gap:5px;margin-right:auto}
.inkColors button{width:22px;height:22px;min-width:22px;padding:0;border-radius:999px;border:3px solid white;box-shadow:0 2px 0 rgba(20,83,45,.16),0 0 0 1px rgba(20,83,45,.18)}
.inkColors button.active{outline:3px solid rgba(34,197,94,.45)}
.drawCanvas{width:100%;height:100%;min-height:90px;border-radius:12px;background:#fff;border:2px solid rgba(34,197,94,.35);touch-action:none;display:block;cursor:crosshair}
.feedback{height:48px;min-height:48px;background:white;border-radius:16px;padding:10px 12px;font-size:14px;font-weight:600;border:3px solid rgba(0,0,0,.05);display:flex;align-items:center}
.feedback.good{background:linear-gradient(135deg,#dcfce7,#fff3a3,#ffd6f1);color:#166534;border-color:#86efac;animation:partyPulse .55s ease-in-out 2}@keyframes partyPulse{50%{transform:scale(1.025);filter:saturate(1.4)}}
.feedback.bad{background:#fee2e2;color:#991b1b;border-color:#fecaca}
.fraction{display:inline-grid;grid-template-rows:auto 3px auto;align-items:center;text-align:center;line-height:1;margin:0 4px;font-weight:950;vertical-align:middle}
.fraction .num,.fraction .den{font-size:34px;line-height:1.02;padding:0 5px}
.fraction .bar{height:3px;background:currentColor;border-radius:9px}
.mathLine{display:flex;align-items:center;gap:11px;flex-wrap:wrap;font-size:34px;font-weight:950}
.resultInput{font-size:30px;font-weight:950;padding:8px 10px;border-radius:14px;border:3px solid #ffb3d1;width:120px;text-align:center;background:#fff7fd}
.resultInput.activeInput{outline:4px solid rgba(255,77,166,.35);border-color:#ff4da6;background:#fff0f8}
.mixInput{width:155px}
.signBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:300px;margin-top:10px}
.numPad{display:grid;grid-template-columns:repeat(6,52px);gap:6px;margin-top:10px;justify-content:center}
.numPad button{padding:9px 0;font-size:20px;text-align:center}
.choiceGrid{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:8px;margin-top:10px}
.choiceGrid button{padding:12px 8px;font-size:17px;text-align:center}
.inputFracBox{display:inline-grid;grid-template-rows:auto 3px auto;align-items:center;text-align:center}
.inputFracBox input{margin:auto}
.badClient{position:absolute;font-size:48px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.18));z-index:6}
.badBubble{position:absolute;background:white;border:3px solid #7c2d12;border-radius:16px;padding:5px 9px;font-size:15px;font-weight:950;z-index:7;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.signBtns button{font-size:30px;padding:14px}
svg.fracSvg{width:230px;height:230px;max-width:45vw;max-height:31vh}
svg.fracSvg.small{width:160px;height:160px;max-height:21vh}
.slice{stroke:#6f3b1d;stroke-width:2.2}
.multiVisual{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.bottomGame{position:relative;height:225px;min-height:225px;border-radius:24px;overflow:hidden;border:4px solid #ffb5d7;background:linear-gradient(#aeeeff 0 43%,#fce7b2 43% 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.45)}
.gameHud{position:absolute;left:10px;top:10px;z-index:5;background:white;border-radius:14px;padding:7px 11px;font-weight:950;box-shadow:0 4px 0 rgba(0,0,0,.08);font-size:14px}
.cafeScene{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:720px;height:220px;z-index:2}
.floor{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#c08457,#8b5a38)}
.part{opacity:0;transform:translateY(14px) scale(.96);transition:opacity .35s ease, transform .35s ease, filter .3s}
.part.on{opacity:1;transform:translateY(0) scale(1)}
.cafeBody{position:absolute;left:180px;bottom:40px;width:360px;height:142px;background:linear-gradient(#ffb3d1,#ff8fc7);border:6px solid #b45309;border-bottom:0;border-radius:22px 22px 0 0;transition:filter .3s, background .3s}
.awning{position:absolute;left:164px;bottom:173px;width:392px;height:33px;background:repeating-linear-gradient(90deg,#fff 0 35px,#ff4da6 35px 70px);border:5px solid #b45309;border-radius:16px 16px 6px 6px;transition:filter .3s}
.sign{position:absolute;left:265px;bottom:196px;width:190px;height:36px;background:#fff7df;border:5px solid #b45309;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:950;color:#7c2d12}
.window{position:absolute;bottom:78px;width:75px;height:58px;background:linear-gradient(#dff7ff,#8bd8ff);border:5px solid white;border-radius:14px;transition:filter .3s}
.w1{left:210px}.w2{left:425px}
.door{position:absolute;left:322px;bottom:40px;width:78px;height:91px;background:#74411f;border:5px solid #4b2b13;border-bottom:0;border-radius:16px 16px 0 0}
.handle{position:absolute;right:12px;top:45px;width:9px;height:9px;background:#facc15;border-radius:50%}
.case{position:absolute;left:235px;bottom:137px;width:250px;height:34px;background:#fff;border:4px solid #7c2d12;border-radius:14px;display:flex;align-items:center;justify-content:space-around;font-size:20px;transition:filter .3s}
.customer{position:absolute;bottom:44px;font-size:50px;filter:drop-shadow(0 4px 2px rgba(0,0,0,.13));transition:opacity .3s}
.speech{position:absolute;bottom:110px;background:white;border:3px solid #7c2d12;border-radius:16px;padding:5px 9px;font-size:15px;font-weight:950;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .3s;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.speech.on{opacity:1;transform:translateY(0)}
.sp1{left:70px}.sp2{right:70px}
.c1{left:95px}.c2{right:100px}
.layerItem{position:absolute;width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1;transition:all .35s;filter:drop-shadow(0 3px 1px rgba(0,0,0,.12));pointer-events:none}
.layerItem.htmlLayer{width:auto;height:auto;display:block}
.decor{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.25)}}
.damage{animation:jiggle .35s ease-in-out 2}
@keyframes jiggle{25%{transform:translateX(-3px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.closed{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);z-index:8;background:#b91c1c;color:white;border:8px solid white;border-radius:18px;padding:13px 24px;font-size:40px;font-weight:950;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.flash{position:absolute;inset:0;background:rgba(255,255,255,.7);opacity:0;pointer-events:none}.flash.on{animation:flash .45s}@keyframes flash{50%{opacity:1}}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20}.confetti i{position:absolute;top:-24px;font-style:normal;font-size:22px;animation:fall 1s linear forwards}@keyframes fall{to{transform:translateY(310px) rotate(260deg);opacity:.1}}.textHelp{font-size:18px;line-height:1.35;font-weight:650;text-align:left}.drawHelpBtn{margin-top:10px;padding:10px 12px;font-size:16px;background:#fff0f7;color:#7c2d12}
@media(max-width:900px){
  .app{padding:6px;gap:6px}
  .top{height:46px;min-height:46px}.title{font-size:18px}.stats{font-size:12px}
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .menu{display:flex;overflow-x:auto;gap:8px;padding:6px;min-height:55px}.menu button{min-width:max-content;margin-bottom:0;padding:10px}
  .panel{grid-template-rows:minmax(0,1fr) 205px;padding:8px}
  .workGrid{grid-template-columns:minmax(320px,.88fr) minmax(260px,1.12fr)}
  .promptTitle{font-size:18px}.fraction .num,.fraction .den{font-size:29px}.mathLine{font-size:29px}
  .bottomGame{height:205px;min-height:205px}.cafeScene{transform:translateX(-50%) scale(.74);transform-origin:bottom center}
}
@media(max-width:650px){
  .workGrid{grid-template-columns:1fr;grid-template-rows:150px minmax(130px,1fr)}
  .leftExercise{justify-content:flex-start}.helpPane{min-height:130px}
  .panel{grid-template-rows:minmax(0,1fr) 185px}
  .bottomGame{height:185px;min-height:185px}.cafeScene{transform:translateX(-50%) scale(.62)}
  svg.fracSvg{width:170px;height:170px}.signBtns{max-width:260px}
}

/* ===== v16 responsive override ===== */
.panel{
  grid-template-rows:minmax(0,1fr) clamp(250px,34vh,330px) !important;
}
.bottomGame{
  height:clamp(250px,34vh,330px) !important;
  min-height:clamp(250px,34vh,330px) !important;
}

}

}
svg.fracSvg{

}

}
@media (min-width:1200px){

  .menu{padding:6px}
  .menu button{padding:9px 8px;font-size:14px;margin-bottom:6px}

@media (max-width:699px){

 .topMenu{min-height:60px}

</head>
<body>
<div class="app">
  <div class="top">
    <div class="title">🍰 Sweet Fractions Café <span class="titleTablet" aria-label="tablet vertical" title="Tablet vertical">📱</span></div>
    <div class="stats">⭐ <span id="stars">0</span> | ❌ <span id="fails">0</span> | Estado: <span id="stateTxt">Construyendo</span></div>
  </div>

  <nav class="menu topMenu">
      <button class="homeBtn" onclick="goHome()">🏠</button>
      <button class="active" onclick="setMode('all',this)">🎲 Todo</button>
      <button onclick="setMode('compare',this)">⚖️ Comparacions</button>
      <button onclick="setMode('ops',this)">➕➖ Sumes/restes</button>
      <button onclick="setMode('mixed',this)">🎂 Mixtos</button>
      <button onclick="setMode('read',this)">📖 Lectura</button>
      <button onclick="resetCafe()">↺ Reset</button>
    </nav>

  <div class="main">
    <section class="panel">
      <div class="exerciseBox">
        <div class="modeTitle">
          <div class="promptTitle" id="modeTitle">🎲 Todo</div>
          <div class="actionRow">
            <button id="helpBtn" onclick="showHelp()">👀 Ajuda</button>
            <button onclick="newQuestion()">Nova</button>
          </div>
        </div>

        <div class="fractionNote">
          <div>Abajo: trozos iguales está cortada la pizza.</div>
          <div>Arriba: cuántos trozos cogemos o nos comemos.</div>
        </div>

        <div class="workGrid" id="workGrid">
          <div class="leftExercise" id="questionPane"></div>
          <div class="helpPane" id="helpPane"><div class="helpEmpty">Pulsa “Ajuda” para ver el dibujo sin cambiar el ejercicio.</div></div>
        </div>

        <div class="feedback" id="feedback">Empieza resolviendo la fracción.</div>
      </div>

      <div class="bottomGame" id="bottomGame">
        <div class="flash" id="flash"></div><div class="confetti" id="confetti"></div>
        <div class="gameHud" id="gameHud"></div>
        <div class="cafeScene">
          <div class="floor part" id="floor"></div>
          <div class="cafeBody part" id="cafeBody"></div>
          <div class="awning part" id="awning"></div>
          <div class="sign part" id="sign">SWEET CAFÉ</div>
          <div class="window w1 part" id="w1"></div>
          <div class="window w2 part" id="w2"></div>
          <div class="door part" id="door"><div class="handle"></div></div>
          <div class="case part" id="case">🧁 🍰 🍩 🍪</div>
          <div class="customer c1 part" id="cust1">👧</div>
          <div class="customer c2 part" id="cust2">🧒</div>
          <div class="speech sp1" id="sp1">Mmm!</div>
          <div class="speech sp2" id="sp2">Deliciós!</div>
          <div id="layers"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<script>
let stars=0, fails=0, build=0;
let currentMode='all';
let current={};
let activeInputId=null;
let lastMixedKey='';
const dens=[2,3,4,5,6,8,9,10,12];
const rectGrids={2:[2,1],3:[3,1],4:[2,2],6:[3,2],8:[4,2],9:[3,3],10:[5,2],12:[4,3]};

function $(id){return document.getElementById(id)}
function goHome(){ location.href='../index.html'; }
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function fracHTML(n,d){return `<span class="fraction"><span class="num">${n}</span><span class="bar"></span><span class="den">${d}</span></span>`}
function setFeed(msg,kind=''){$('feedback').textContent=msg;$('feedback').className='feedback '+kind}
function modeLabel(mode){return mode==='all'?'🎲 Todo':mode==='compare'?'⚖️ Comparacions':mode==='ops'?'➕➖ Sumes/restes':mode==='mixed'?'🎂 Mixtos':'📖 Lectura'}
function pickAllMode(){return rand(['compare','compare','ops','ops','mixed','mixed','mixed','read'])}
let drawMode='draw';
let drawColor='#1f2937';
let visualHelpOpen=false;
function markActiveInput(){
  document.querySelectorAll('.resultInput').forEach(el=>el.classList.toggle('activeInput',el.id===activeInputId));
}
function drawPadHTML(){
  const colors=['#1f2937','#dc2626','#2563eb','#16a34a','#f59e0b'];
  return `<div class="drawPad"><div class="drawTools"><div class="inkColors">${colors.map(c=>`<button type="button" data-color="${c}" onclick="setDrawColor('${c}')" style="background:${c}"></button>`).join('')}</div><button id="eraserBtn" onclick="toggleEraser()">Goma</button><button onclick="clearDrawPad()">Limpiar</button></div><canvas id="drawCanvas" class="drawCanvas"></canvas></div>`;
}
function setReadLayout(isRead){
  $('workGrid').classList.toggle('readMode',isRead);
  $('helpBtn').style.display=isRead?'none':'';
  $('helpPane').innerHTML=isRead?'':drawPadHTML();
  visualHelpOpen=false;
  if(!isRead) setTimeout(initDrawPad,0);
}

function setMode(mode,btn){
  currentMode=mode;
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  $('modeTitle').textContent=modeLabel(mode);
  newQuestion();
}

function newQuestion(){
  const mode=currentMode==='all'?pickAllMode():currentMode;
  if(currentMode==='all') $('modeTitle').textContent='🎲 Todo · '+modeLabel(mode).replace(/^.. /,'');
  else $('modeTitle').textContent=modeLabel(currentMode);
  activeInputId=null;
  setReadLayout(mode==='read');
  markActiveInput();
  if(mode==='compare') newCompare();
  if(mode==='ops') newOps();
  if(mode==='mixed') newMixed();
  if(mode==='read') newRead();
}

function renderButtonsCompare(){
  return `<div class="signBtns"><button onclick="answerCompare('<')">&lt;</button><button onclick="answerCompare('=')">=</button><button onclick="answerCompare('>')">&gt;</button></div>`;
}
function resultSquare(){return `<span style="display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:4px solid #ff8fc7;border-radius:10px;background:#fff7fd;font-weight:950">?</span>`}
function canGrid(d){return !!rectGrids[d]}
function chooseGridShape(d){return canGrid(d)?rand(['circle','rect']):'circle'}
function chooseCompareShape(pattern,d1,d2){
  if(pattern==='different') return 'circle';
  if(pattern==='sameDen') return canGrid(d1)?rand(['circle','rect']):'circle';
  if(pattern==='sameNum') return (canGrid(d1)&&canGrid(d2))?rand(['circle','rect']):'circle';
  return 'circle';
}

function newCompare(){
  const color=rand(['#ff9f43','#ff6ec7','#8be35b','#8bd8ff','#c084fc']);
  const pattern=rand(['sameDen','sameNum','different']);
  let d1=rand(dens), d2=rand(dens), n1, n2;
  if(pattern==='sameDen'){d2=d1;n1=ri(1,d1);n2=ri(1,d2)}
  else if(pattern==='sameNum'){while(d2===d1)d2=rand(dens);n1=n2=ri(1,Math.min(d1,d2))}
  else{while(d2===d1)d2=rand(dens);n1=ri(1,d1);n2=ri(1,d2)}
  const shape=chooseCompareShape(pattern,d1,d2);
  current={type:'compare',pattern,d1,d2,n1,n2,shape,color,ans:(n1/d1>n2/d2)?'>':(n1/d1<n2/d2)?'<':'='};
  $('questionPane').innerHTML=`<div><div class="mathLine">${fracHTML(n1,d1)} ${resultSquare()} ${fracHTML(n2,d2)}</div>${renderButtonsCompare()}</div>`;
  setFeed(pattern==='different'?'Compara mentalmente y mira el dibujo de entrada.':'Compara mentalmente. Pulsa Ajuda para una pista de texto.');
  if(pattern==='different'){ showCompareDrawing(); }
}
function answerCompare(a){
  if(a===current.ans){good('¡Correcto!');setTimeout(newQuestion,650)}
  else bad('No. Mira si una cantidad es mayor, menor o igual.');
}

function inputFracHTML(numW=70,denW=70){
  return `<div class="inputFracBox"><input id="numInput" readonly onclick="selectInput('numInput')" class="resultInput" style="width:${numW}px" placeholder="?"><div style="height:3px;background:#000;border-radius:8px;width:${numW}px"></div><input id="denInput" readonly onclick="selectInput('denInput')" class="resultInput" style="width:${denW}px" placeholder="?"></div>`;
}
function numPadHTML(){
  const keys=['1','2','3','4','5','6','7','8','9','0','⌫','OK'];
  return `<div class="numPad">${keys.map(k=>`<button onclick="padKey('${k}')">${k}</button>`).join('')}</div>`;
}
function selectInput(id){activeInputId=id; markActiveInput(); const el=$(id); if(el)el.focus({preventScroll:true});}
function inputOrder(){
  return ['wholeInput','numInput','denInput'].filter(id=>$(id));
}
function expectedInputLength(id){
  if(current.type==='ops'){
    if(id==='numInput') return String(current.n).length;
    if(id==='denInput') return String(current.d).length;
  }
  if(current.type==='mixed'){
    if(id==='wholeInput') return String(current.whole).length;
    if(id==='numInput') return String(current.rem).length;
    if(id==='denInput') return String(current.d).length;
  }
  return 1;
}
function moveToNextInput(fromId){
  const el=$(fromId);
  if(el && el.value.length<expectedInputLength(fromId)) return;
  const order=inputOrder();
  const index=order.indexOf(fromId);
  if(index>=0 && index<order.length-1) selectInput(order[index+1]);
}
function padKey(k){
  if(k==='OK'){checkTyped();return}
  const el=activeInputId?$(activeInputId):($('numInput')||$('wholeInput'));
  if(!el)return;
  activeInputId=el.id;
  markActiveInput();
  if(k==='⌫') el.value=el.value.slice(0,-1);
  else{
    el.value+=k;
    moveToNextInput(el.id);
  }
}

function newOps(){
  const d=rand(dens.filter(x=>x<=10)); let a=ri(1,d-1),b=ri(1,d-1),op=rand(['+','-']);
  if(op==='-'&&b>a)[a,b]=[b,a];
  const n=op==='+'?a+b:a-b;
  current={type:'ops',d,a,b,op,n,ans:n+'/'+d,shape:chooseGridShape(d),color:'#ff9f43'};
  $('questionPane').innerHTML=`<div><div class="mathLine">${fracHTML(a,d)} <span>${op}</span> ${fracHTML(b,d)} <span>=</span>${inputFracHTML(70,70)}<button onclick="checkTyped()" style="padding:10px 14px;font-size:20px">Comprobar</button></div>${numPadHTML()}</div>`;
  setFeed('Resuelve sin ayuda. Escribe el resultado al lado del igual.');
  selectInput('numInput');
}
function newMixed(){
  let d,whole,rem,n,key;
  for(let tries=0;tries<12;tries++){
    d=rand([3,4,5,6,8]); whole=ri(1,2); rem=ri(1,d-1); n=whole*d+rem; key=`${whole}-${rem}-${d}`;
    if(key!==lastMixedKey) break;
  }
  lastMixedKey=key;
  current={type:'mixed',d,whole,rem,n,ans:`${whole} ${rem}/${d}`,shape:chooseGridShape(d),color:'#ff6ec7'};
  $('questionPane').innerHTML=`<div><div class="mathLine">${fracHTML(n,d)} <span>=</span><input id="wholeInput" readonly onclick="selectInput('wholeInput')" class="resultInput" style="width:55px" placeholder="?">${inputFracHTML(60,60)}<button onclick="checkTyped()" style="padding:10px 14px;font-size:20px">Comprobar</button></div>${numPadHTML()}</div>`;
  setFeed('Convierte a número mixto. El dibujo solo aparece con Ajuda.');
  selectInput('wholeInput');
}

function checkTyped(){
  if(current.type==='ops'){
    const vnum=($('numInput')?.value||'').trim();
    const vden=($('denInput')?.value||'').trim();
    const val=vnum+'/'+vden;
    if(val===current.ans){good('¡Perfecto!');setTimeout(newQuestion,650)}
    else bad('No. Revisa numerador y denominador.');
  }else if(current.type==='mixed'){
    const whole=($('wholeInput')?.value||'').trim();
    const vnum=($('numInput')?.value||'').trim();
    const vden=($('denInput')?.value||'').trim();
    const val=whole+' '+vnum+'/'+vden;
    if(val===current.ans){good('¡Muy bien!');setTimeout(newQuestion,650)}
    else bad('No. Cuenta enteros y fracción restante.');
  }
}

const numerals={1:'un',2:'dos',3:'tres',4:'quatre',5:'cinc',6:'sis',7:'set',8:'vuit',9:'nou',10:'deu',11:'onze',12:'dotze'};
const denSing={2:'mig',3:'terç',4:'quart',5:'cinquè',6:'sisè',7:'setè',8:'vuitè',9:'novè',10:'desè',12:'dotzè'};
const denPlur={2:'mitjos',3:'terços',4:'quarts',5:'cinquens',6:'sisens',7:'setens',8:'vuitens',9:'novens',10:'desens',12:'dotzens'};
function readText(n,d){return `${numerals[n]} ${n===1?denSing[d]:denPlur[d]}`;}
function newRead(){
  const d=rand([2,3,4,5,6,7,8,9,10,12]); const n=ri(1,Math.min(d,9));
  const ans=readText(n,d);
  const opts=new Set([ans]);
  while(opts.size<4){const dd=rand([2,3,4,5,6,7,8,9,10,12]); const nn=ri(1,Math.min(dd,9)); opts.add(readText(nn,dd));}
  const arr=[...opts].sort(()=>Math.random()-.5);
  current={type:'read',n,d,ans,color:'#c084fc',shape:chooseGridShape(d)};
  $('questionPane').innerHTML=`<div><div class="mathLine">${fracHTML(n,d)}</div><div class="choiceGrid">${arr.map(o=>`<button onclick="answerRead('${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}</div></div>`;
  setFeed('Lee la fracción y elige cómo se dice en catalán.');
}
function answerRead(o){
  if(o===current.ans){good('¡Lectura correcta!');setTimeout(newQuestion,650)}
  else bad('No. Revisa numerador y denominador.');
}

function initDrawPad(){
  const canvas=$('drawCanvas');
  if(!canvas || canvas.dataset.ready==='1') return;
  canvas.dataset.ready='1';
  const ctx=canvas.getContext('2d');
  let drawing=false,last=null;
  function resize(){
    const rect=canvas.getBoundingClientRect();
    const img=canvas.width&&canvas.height?ctx.getImageData(0,0,canvas.width,canvas.height):null;
    canvas.width=Math.max(1,Math.round(rect.width*devicePixelRatio));
    canvas.height=Math.max(1,Math.round(rect.height*devicePixelRatio));
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.lineCap='round';ctx.lineJoin='round';
    if(img){try{ctx.putImageData(img,0,0)}catch(e){}}
  }
  function pos(e){
    const r=canvas.getBoundingClientRect();
    return {x:e.clientX-r.left,y:e.clientY-r.top};
  }
  function stroke(e){
    if(!drawing) return;
    const p=pos(e);
    ctx.globalCompositeOperation=drawMode==='erase'?'destination-out':'source-over';
    ctx.strokeStyle=drawColor;
    ctx.lineWidth=drawMode==='erase'?18:4;
    ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
    last=p;
  }
  resize();
  window.addEventListener('resize',resize);
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;last=pos(e);stroke(e)});
  canvas.addEventListener('pointermove',e=>{e.preventDefault();stroke(e)});
  canvas.addEventListener('pointerup',()=>{drawing=false;last=null});
  canvas.addEventListener('pointercancel',()=>{drawing=false;last=null});
  setDrawMode(drawMode);
}
function setDrawMode(mode){
  drawMode=mode;
  const b=$('eraserBtn');
  if(b)b.classList.toggle('active',drawMode==='erase');
  document.querySelectorAll('.inkColors button').forEach(btn=>btn.classList.toggle('active',btn.dataset.color===drawColor&&drawMode!=='erase'));
}
function setDrawColor(color){
  drawColor=color;
  setDrawMode('draw');
}
function toggleEraser(){
  setDrawMode(drawMode==='erase'?'draw':'erase');
}
function clearDrawPad(){
  const canvas=$('drawCanvas');
  if(!canvas) return;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
function showHelp(){
  if(current.type==='read') return;
  if(visualHelpOpen){
    visualHelpOpen=false;
    $('helpPane').innerHTML=drawPadHTML();
    setTimeout(initDrawPad,0);
    return;
  }
  fails++;
  updateCafe();
  showVisualHelp();
  visualHelpOpen=true;
}
function showVisualHelp(){
  if(current.type==='compare'){
    showCompareDrawing();
  }else if(current.type==='ops'){
    $('helpPane').innerHTML=`<div class="multiVisual" style="gap:10px;align-items:center">
      <div style="text-align:center;font-weight:900">${fracHTML(current.a,current.d)}<br>${visualSVG(current.d,current.a,current.color,current.shape,'small')}</div>
      <div style="font-size:36px;font-weight:950">${current.op}</div>
      <div style="text-align:center;font-weight:900">${fracHTML(current.b,current.d)}<br>${visualSVG(current.d,current.b,current.color,current.shape,'small')}</div>
    </div>`;
  }else if(current.type==='mixed'){
    let html='<div class="multiVisual">';
    for(let i=0;i<current.whole;i++) html+=visualSVG(current.d,current.d,current.color,'circle','small');
    html+=visualSVG(current.d,current.rem,current.color,'circle','small')+'</div>';
    $('helpPane').innerHTML=html;
  }
}

function showCompareTextHelp(){
  let msg='';
  if(current.pattern==='sameNum'){
    msg=`<div class="textHelp"><b>Mismo numerador.</b><br>Tengo lo mismo para repartir entre más gente. ¿En qué caso les doy más?<br><br>Ejemplo: si reparto ${current.n1} entre ${current.d1} personas o entre ${current.d2} personas, cada persona recibe más cuando hay menos personas.</div>`;
  }else if(current.pattern==='sameDen'){
    msg=`<div class="textHelp"><b>Mismo denominador.</b><br>Tengo distintas cantidades para repartir entre la misma gente. ¿En qué caso les doy más?<br><br>Ejemplo: si reparto ${current.n1} o ${current.n2} entre ${current.d1} personas, gana la cantidad mayor.</div>`;
  }else{
    msg=`<div class="textHelp"><b>Distinto numerador y denominador.</b><br>En cada caso piensa si a cada persona le darán mucho o poco y compáralos mentalmente.</div>`;
  }
  $('helpPane').innerHTML=msg+`<button class="drawHelpBtn" onclick="showCompareDrawing()">Ver dibujo</button>`;
}

function showCompareDrawing(){
  $('helpPane').innerHTML=`<div class="multiVisual"><div>${visualSVG(current.d1,current.n1,current.color,current.shape)}</div><div style="font-size:30px;font-weight:950">?</div><div>${visualSVG(current.d2,current.n2,current.color,current.shape)}</div></div>`;
}

function visualSVG(d,n,color,type='circle',size=''){
  let s=`<svg class="fracSvg ${size}" viewBox="0 0 300 300">`;
  if(type==='rect' && canGrid(d)){
    const [cols,rows]=rectGrids[d]; const w=240/cols, h=200/rows, x0=30,y0=50;
    s+=`<rect x="${x0}" y="${y0}" width="240" height="200" rx="10" fill="#fff1cc" stroke="#6f3b1d" stroke-width="4"></rect>`;
    for(let i=0;i<d;i++){
      const c=i%cols,r=Math.floor(i/cols);
      s+=`<rect class="slice" x="${x0+c*w}" y="${y0+r*h}" width="${w}" height="${h}" rx="0" fill="${i<n?color:'#fff1cc'}"></rect>`;
    }
  }else{
    const cx=150,cy=150,r=120;
    s+=`<circle cx="150" cy="150" r="126" fill="#b45309"/>`;
    for(let i=0;i<d;i++){
      const a0=-Math.PI/2+i*2*Math.PI/d, a1=-Math.PI/2+(i+1)*2*Math.PI/d;
      const x1=cx+r*Math.cos(a0),y1=cy+r*Math.sin(a0),x2=cx+r*Math.cos(a1),y2=cy+r*Math.sin(a1);
      const large=(a1-a0)>Math.PI?1:0;
      s+=`<path class="slice" fill="${i<n?color:'#fff1cc'}" d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z"/>`;
    }
  }
  return s+'</svg>';
}

function good(msg){
  if(window.LucYagoReto) window.LucYagoReto.record(true);
  stars++; build=Math.min(20,build+1); if(fails>0)fails--;
  setFeed('🎉 '+msg+' 🎉','good'); flash(); party(); updateCafe();
}
function bad(msg){
  if(window.LucYagoReto) window.LucYagoReto.record(false);
  fails++; build=Math.max(0,build-1);
  setFeed(msg,'bad'); shake(); updateCafe();
}
function resetCafe(){stars=0;fails=0;build=0;updateCafe();setFeed('Cafetería reiniciada.');}
function flash(){const f=$('flash');f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}
function party(){
  const c=$('confetti'); if(!c) return; c.innerHTML='';
  const bits=['🎉','⭐','🍰','✨','🧁','🎈','🍓'];
  for(let i=0;i<28;i++){
    const e=document.createElement('i');
    e.textContent=bits[Math.floor(Math.random()*bits.length)];
    e.style.left=Math.floor(Math.random()*96)+'%';
    e.style.animationDelay=(Math.random()*.25)+'s';
    c.appendChild(e);
  }
  setTimeout(()=>{c.innerHTML=''},1150);
}
function shake(){const b=$('bottomGame');b.classList.remove('damage');void b.offsetWidth;b.classList.add('damage')}

function updateCafe(){
  $('stars').textContent=stars;$('fails').textContent=fails;
  const layers=$('layers');layers.innerHTML='';
  const body=$('cafeBody'), awning=$('awning'), caseEl=$('case'), c1=$('cust1'), c2=$('cust2'), w1=$('w1'), w2=$('w2');
  const parts = ['floor','cafeBody','awning','sign','w1','w2','door','case','cust1','cust2','sp1','sp2'];
  parts.forEach(id=>$(id).classList.remove('on'));

  if(build>=1) $('floor').classList.add('on');
  if(build>=2) $('cafeBody').classList.add('on');
  if(build>=3) $('awning').classList.add('on');
  if(build>=4) $('sign').classList.add('on');
  if(build>=5){$('w1').classList.add('on');$('w2').classList.add('on');}
  if(build>=6) $('door').classList.add('on');
  if(build>=7) $('case').classList.add('on');
  if(build>=8){$('cust1').classList.add('on');$('cust2').classList.add('on');$('sp1').classList.add('on');$('sp2').classList.add('on');}

  body.style.filter='none';awning.style.filter='none';caseEl.style.filter='none';w1.style.filter='none';w2.style.filter='none';
  c1.textContent='😊';c2.textContent='😋';caseEl.textContent='🧁 🍰 🍩 🍪';
  $('sp1').textContent='Mmm!'; $('sp2').textContent='Deliciós!';

  let state='Vacía';
  if(build>=1) state='Suelo';
  if(build>=2) state='Fachada';
  if(build>=3) state='Toldo';
  if(build>=4) state='Cartel';
  if(build>=5) state='Ventanas';
  if(build>=6) state='Puerta';
  if(build>=7) state='Vitrina';
  if(build>=8) state='Cafetería abierta';

  if(build>=8){
    if(stars>=10){c1.textContent='😍'; c2.textContent='🥳'; $('sp1').textContent='Boníssim!'; $('sp2').textContent='Una altra!';}
    if(stars>=14){add('★',72,42,'decor'); add('✦',610,42,'decor');}
    const goodIcons=['✨','🧁','🍓','🍩','🎈','🌸','🍰','🍪','🧋','🍒','⭐','🎉'];
    const goodSpots=[[120,60],[180,120],[240,72],[300,142],[360,68],[420,130],[480,80],[540,140],[130,170],[230,172],[390,172],[520,170]];
    for(let i=0;i<Math.min(stars-8,12);i++) add(goodIcons[i%goodIcons.length], goodSpots[i][0], goodSpots[i][1], 'decor');
  }

  // Si empieza fallando antes de construir, aparecen clientes descontentos fuera del futuro café.
  if(build<8 && fails>0){
    const angry=['😡','😤','😢','🙁','😱'];
    const texts=['No hay café!','Qué desastre!','Me quejo!','Me voy!','Arregla esto!'];
    const angrySpots=[[60,34],[158,34],[256,34],[354,34],[452,34]];
    const bubbleSpots=[[50,92],[148,92],[246,92],[344,92],[442,92]];
    for(let i=0;i<Math.min(fails,5);i++){
      add(`<span class="badClient">${angry[i]}</span>`, angrySpots[i][0], angrySpots[i][1], 'html');
      add(`<span class="badBubble">${texts[i]}</span>`, bubbleSpots[i][0], bubbleSpots[i][1], 'html');
    }
    state='Clientes descontentos';
  }

  if(fails>=1){add('💨',520,87); if(build>=8){c1.textContent='😕';$('sp1').textContent='Huele raro...';} if(build>=8)state='Humo'}
  if(fails>=2){add('🗑️',120,34);add('🪳',580,35); if(build>=8){c2.textContent='😬';$('sp2').textContent='Qué asco!';} if(build>=8)state='Sucio'}
  if(fails>=3){add('🔥',475,72);add('🤢',92,84);caseEl.textContent='🥀 🍰 🥴'; if(build>=8){c1.textContent='🤢';c2.textContent='😱';$('sp1').textContent='Me voy!';$('sp2').textContent='Socorro!';} if(build>=8)state='Caos'}
  if(fails>=4){
    body.style.filter='grayscale(.6) brightness(.75)'; awning.style.filter='grayscale(.55) brightness(.8)'; w1.style.filter='grayscale(.55) brightness(.8)'; w2.style.filter='grayscale(.55) brightness(.8)'; caseEl.style.filter='grayscale(.45)';
    add('🕷️',225,122);add('⚠️',360,150);
    if(build>=8){c1.textContent='😡';c2.textContent='🏃';$('sp1').textContent='Reclamación!'; $('sp2').textContent='Adiós!';}
    state='Peligro';
  }
  if(fails>=5){addClosed();state='CERRADA'}
  $('stateTxt').textContent=state;
}
function add(txt,x,y,cls=''){
  const safeX=Math.max(32,Math.min(640,x));
  const safeY=Math.max(28,Math.min(176,y));
  const e=document.createElement('div');e.className='layerItem '+(cls==='html'?'htmlLayer':cls);e.style.left=safeX+'px';e.style.bottom=safeY+'px';
  if(cls==='html') e.innerHTML=txt; else e.textContent=txt;
  $('layers').appendChild(e)
}
function addClosed(){const e=document.createElement('div');e.className='closed';e.textContent='🚫 CLOSED';$('layers').appendChild(e)}

newQuestion();
updateCafe();
</script>

<script id="lucyago-reto-common">
/* LucYagoReto Common v1 */
(function(){
  const params=new URLSearchParams(location.search);
  const active=params.get('reto')==='1';
  if(!active) return;
  const game=params.get('game')||document.title||'juego';
  const target=Math.max(1,parseInt(params.get('preguntas')||'10',10));
  const returnUrl=params.get('return')||'../reto_mixto.html';
  const sessionKey=params.get('session')||'lucyago_reto_session';
  let locked=false;
  function getSession(){try{return JSON.parse(localStorage.getItem(sessionKey)||'{}')}catch(e){return {}}}
  function setSession(s){localStorage.setItem(sessionKey,JSON.stringify(s));}
  function ensureGame(s){
    s.results=s.results||{};
    if(!s.results[game]) s.results[game]={ok:0,bad:0,total:target,target:target,done:false,name:game};
    s.results[game].total=target; s.results[game].target=target;
    return s.results[game];
  }
  function total(r){return (r.ok||0)+(r.bad||0)}
  function paint(){
    const s=getSession(), r=ensureGame(s);
    let bar=document.getElementById('lucyagoRetoBar');
    if(!bar){
      bar=document.createElement('div');bar.id='lucyagoRetoBar';
      bar.style.cssText='position:fixed;left:10px;right:10px;bottom:10px;z-index:999999;background:#fffdf8;color:#21314c;border:3px solid #ffd84d;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px 12px;font-family:Arial,sans-serif;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px;';
      document.body.appendChild(bar);
    }
    const done=Math.min(target,(r.ok||0));
    bar.innerHTML='<span>🎯 Reto mixto · '+game+' · ✅ '+done+'/'+target+'</span><span>Errores: ❌ '+(r.bad||0)+'</span>';
    setSession(s);
  }
  function finish(){
    if(locked) return; locked=true;
    const s=getSession(), r=ensureGame(s); r.done=true; s.lastFinished=game; setSession(s);
    paint();
    setTimeout(()=>{location.href=returnUrl+'?continue=1&session='+encodeURIComponent(sessionKey);},450);
  }
  window.LucYagoReto={
    active:true, game, target, sessionKey,
    record:function(ok){
      if(locked) return;
      const s=getSession(), r=ensureGame(s);
      if((r.ok||0)>=target) {finish(); return;}
      if(ok) r.ok=(r.ok||0)+1; else r.bad=(r.bad||0)+1;
      setSession(s); paint();
      if((r.ok||0)>=target) finish();
    },
    finish:finish,
    progress:function(){const s=getSession(), r=ensureGame(s); return {ok:r.ok||0,bad:r.bad||0,total:target,done:total(r)}}
  };
  window.addEventListener('load',()=>setTimeout(paint,250));
})();
</script>
